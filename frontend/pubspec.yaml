name: donor_darah_lamongan
description: "Aplikasi Donor Darah Lamongan untuk menghubungkan pendonor, pemohon darah, dan PMI"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.5
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
